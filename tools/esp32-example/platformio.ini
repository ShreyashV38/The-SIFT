; CloudNest ESP32 PlatformIO Configuration
; For use with Wokwi simulator

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Required libraries (Arduino IDE users: install these via Library Manager)
lib_deps =
    ; PubSubClient (by Nick O'Leary) — MQTT client
    knolleary/PubSubClient@^2.8
    ; ArduinoJson (by Benoit Blanchon) — command payload parsing
    bblanchon/ArduinoJson@^6.21.3
    ; DHT sensor library for ESPx (by beegee_tokyo) — DHT22 temperature sensor
    beegee-tokyo/DHT sensor library for ESPx@^1.19
