<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SIFT CloudNest — Multi-tenant smart home IoT platform with isolated Home Assistant instances and ESP32 telemetry onboarding.">
  <meta name="theme-color" content="#0b0f19">
  <title>SIFT CloudNest — Smart Home IoT Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="header-container">
      <a href="#/" class="brand-link" id="brand-home-link">
        <span style="font-size: 1.35rem;">🏠</span>
        <span>SIFT CloudNest</span>
        <span class="brand-badge">IoT</span>
      </a>

      <nav id="header-nav" class="header-nav" aria-label="Main Navigation">
        <!-- Injected dynamically by router based on session state -->
      </nav>
    </div>
  </header>

  <!-- Live Announcements for Accessibility -->
  <div id="aria-live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Main View Container -->
  <main id="app" class="main-content" role="main">
    <!-- Router injects active view here -->
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-label="Notifications" role="region"></div>

  <!-- Client-side SPA Bootstrap -->
  <script type="module">
    import { initRouter } from './js/router.js';

    document.addEventListener('DOMContentLoaded', () => {
      const appContainer = document.getElementById('app');
      const headerNav = document.getElementById('header-nav');
      initRouter(appContainer, headerNav);
    });
  </script>
</body>
</html>
