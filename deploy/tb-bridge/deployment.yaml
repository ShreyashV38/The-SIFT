apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-bridge
  namespace: observability
  labels:
    app.kubernetes.io/name: tb-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tb-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tb-bridge
    spec:
      nodeSelector:
        sift.io/role: worker
      containers:
        - name: tb-bridge
          image: sift/tb-bridge:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: PROVISIONING_API_URL
              value: "http://provisioning-api.provisioning.svc.cluster.local:3000"
            - name: MAGISTRALA_MQTT_URL
              value: "mqtt://magistrala-mqtt.platform.svc.cluster.local:1883"
            - name: TB_MQTT_URL
              value: "mqtt://thingsboard.observability.svc.cluster.local:1883"
            - name: TB_HTTP_URL
              value: "http://thingsboard.observability.svc.cluster.local:8080"
            - name: TB_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tb-bridge-secrets
                  key: gateway-token
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tb-bridge
  namespace: observability
  labels:
    app.kubernetes.io/name: tb-bridge
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  selector:
    app.kubernetes.io/name: tb-bridge
