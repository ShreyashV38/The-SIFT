apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-{{ .Values.tenant.slug }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/instance: {{ .Release.Name }}
    sift.io/tenant: {{ .Values.tenant.slug }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
        app.kubernetes.io/instance: {{ .Release.Name }}
        sift.io/tenant: {{ .Values.tenant.slug }}
    spec:
      serviceAccountName: ha-{{ .Values.tenant.slug }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-config
          image: python:3.12-alpine
          command:
            - sh
            - /config-source/ha-init.sh
          env:
            - name: HA_USERNAME
              value: {{ .Values.haAuth.username | default "admin" | quote }}
            - name: HA_PASSWORD
              value: {{ .Values.haAuth.password | default "CloudNest2026!" | quote }}
            - name: HA_PASSWORD_HASH
              value: {{ .Values.haAuth.passwordHash | default "$2b$10$EbIUIjlZJWAaOAFDX1Vke.fU1UGrOFEDb4Chg4qUlyjpR8gEdIMYa" | quote }}
            - name: MQTT_BROKER_HOST
              value: {{ .Values.mqtt.host | default "magistrala-mqtt.platform.svc.cluster.local" | quote }}
            - name: MQTT_BROKER_PORT
              value: {{ .Values.mqtt.port | default 1883 | quote }}
          volumeMounts:
            - name: ha-config-vol
              mountPath: /config-source
            - name: ha-data
              mountPath: /config
      containers:
        - name: home-assistant
          image: "{{ .Values.homeAssistant.image.repository }}:{{ .Values.homeAssistant.image.tag }}"
          imagePullPolicy: {{ .Values.homeAssistant.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: 8123
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: 8123
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.homeAssistant.resources | nindent 12 }}
          volumeMounts:
            - name: ha-data
              mountPath: /config
      volumes:
        - name: ha-config-vol
          configMap:
            name: ha-config
        - name: ha-data
          {{- if (or (and .Values.persistence .Values.persistence.enabled) (and .Values.homeAssistant (and .Values.homeAssistant.persistence .Values.homeAssistant.persistence.enabled))) }}
          persistentVolumeClaim:
            claimName: ha-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
