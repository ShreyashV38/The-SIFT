apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
  namespace: {{ .Release.Namespace }}
  labels:
    sift.io/tenant: {{ .Values.tenant.slug }}
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "1000m"
        memory: "1Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
