apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: home-assistant
    sift.io/tenant: {{ .Values.tenant.slug }}
data:
  configuration.yaml: |
    # Home Assistant configuration for tenant: {{ .Values.tenant.slug }}
    default_config:

    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16
        - 10.43.0.0/16
        - 127.0.0.1
        - 0.0.0.0/0
        - ::1

    # MQTT integration — auto-configured via .storage/core.config_entries
    # Discovery is enabled by default when MQTT is configured via config entries.

  # Pre-seed onboarding as completed (bypasses the interactive setup wizard)
  onboarding.json: |
    {
      "version": 4,
      "minor_version": 1,
      "key": "onboarding",
      "data": {
        "done": ["user", "core_config", "analytics", "integration"]
      }
    }

  # Pre-seed the auth provider with a local user (bcrypt hash generated at deploy)
  # The initContainer will generate the actual auth and auth_provider files
  ha-init.sh: |
    #!/bin/sh
    set -e
    echo "=== CloudNest HA Init: Pre-seeding auth & onboarding ==="

    # Copy configuration.yaml (don't overwrite if exists)
    cp -n /config-source/configuration.yaml /config/configuration.yaml 2>/dev/null || true
    touch /config/automations.yaml /config/scripts.yaml /config/scenes.yaml
    mkdir -p /config/themes
    mkdir -p /config/.storage

    # 1. Seed onboarding as completed
    cp -n /config-source/onboarding.json /config/.storage/onboarding 2>/dev/null || true

    HA_USER="${HA_USERNAME:-admin}"
    HA_PASS="${HA_PASSWORD:-CloudNest2026!}"

    # Only seed auth and integrations on initial deployment (preserve state on restart)
    if [ ! -f /config/.storage/auth ]; then
      # 2. Generate 32-char hex IDs for user and credential
      USER_ID=$(cat /proc/sys/kernel/random/uuid 2>/dev/null | tr -d '-' || echo "00000000000040008000000000000001")
      CRED_ID=$(cat /proc/sys/kernel/random/uuid 2>/dev/null | tr -d '-' || echo "00000000000040008000000000000002")

      # 3. Seed auth (users and credentials)
      cat > /config/.storage/auth <<AUTHEOF
    {
      "version": 1,
      "minor_version": 2,
      "key": "auth",
      "data": {
        "users": [
          {
            "id": "${USER_ID}",
            "group_ids": ["system-admin"],
            "is_owner": true,
            "is_active": true,
            "name": "${HA_USER}",
            "system_generated": false,
            "local_only": false
          }
        ],
        "groups": [
          {"id": "system-admin", "name": "Administrators"},
          {"id": "system-read-only", "name": "Read Only"},
          {"id": "system-users", "name": "Users"}
        ],
        "credentials": [
          {
            "id": "${CRED_ID}",
            "user_id": "${USER_ID}",
            "auth_provider_type": "homeassistant",
            "auth_provider_id": null,
            "data": {
              "username": "${HA_USER}"
            }
          }
        ],
        "refresh_tokens": [],
        "permissions": {}
      }
    }
    AUTHEOF

      # 4. Seed auth_provider.homeassistant with the username/base64-encoded bcrypt password
      cat > /config/.storage/auth_provider.homeassistant <<HAPEOF
    {
      "version": 1,
      "minor_version": 1,
      "key": "auth_provider.homeassistant",
      "data": {
        "users": [
          {
            "username": "${HA_USER}",
            "password": "${HA_PASSWORD_HASH}"
          }
        ]
      }
    }
    HAPEOF

      # 5. Seed MQTT config entry pointing to Magistrala broker
      MQTT_HOST="${MQTT_BROKER_HOST:-magistrala-mqtt.platform.svc.cluster.local}"
      MQTT_PORT="${MQTT_BROKER_PORT:-1883}"
      ENTRY_ID=$(cat /proc/sys/kernel/random/uuid 2>/dev/null | tr -d '-' | head -c 32 || echo "mqttconfigentry00000001")

      cat > /config/.storage/core.config_entries <<MQTTEOF
    {
      "version": 1,
      "minor_version": 1,
      "key": "core.config_entries",
      "data": {
        "entries": [
          {
            "entry_id": "${ENTRY_ID}",
            "version": 1,
            "domain": "mqtt",
            "title": "Magistrala MQTT",
            "data": {
              "broker": "${MQTT_HOST}",
              "port": ${MQTT_PORT},
              "discovery": true,
              "discovery_prefix": "homeassistant"
            },
            "options": {},
            "pref_disable_new_entities": false,
            "pref_disable_polling": false,
            "source": "user",
            "unique_id": null,
            "disabled_by": null
          }
        ]
      }
    }
    MQTTEOF

      echo "=== CloudNest HA Init: Auth and MQTT pre-seeded ==="
    else
      echo "=== CloudNest HA Init: /config/.storage/auth exists, preserving state ==="
    fi

    echo "  User: ${HA_USER}"
    echo "  Onboarding: bypassed"
