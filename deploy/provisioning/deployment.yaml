apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: provisioning-data-pvc
  namespace: provisioning
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-api
  namespace: provisioning
  labels:
    app.kubernetes.io/name: provisioning-api
    app.kubernetes.io/part-of: cloudnest
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: provisioning-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provisioning-api
        app.kubernetes.io/part-of: cloudnest
    spec:
      serviceAccountName: provisioning-api
      automountServiceAccountToken: true
      nodeSelector:
        sift.io/role: worker
      containers:
        - name: provisioning-api
          image: sift/provisioning-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: internal
              containerPort: 8081
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: INTERNAL_PORT
              value: "8081"
            - name: DB_PATH
              value: "/data/cloudnest.db"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: provisioning-secrets
                  key: database-url
                  optional: true
            - name: DB_POOL_MAX
              value: "5"
            - name: HA_HELM_CHART_PATH
              value: "/app/charts/ha-tenant"
            - name: IDENTITY_SERVICE_URL
              value: "http://sift-identity-service:3001"
            - name: IOT_BROKER_SERVICE_URL
              value: "http://sift-iot-broker-service:3004"
            - name: PROVISIONING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provisioning-secrets
                  key: api-key
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: provisioning-secrets
                  key: jwt-secret
                  optional: true
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: provisioning-secrets
                  key: internal-token
                  optional: true
            - name: MAGISTRALA_URL
              value: "http://magistrala-things.platform.svc.cluster.local:8182"
            - name: TB_URL
              value: "http://thingsboard.observability.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: provisioning-data-pvc
