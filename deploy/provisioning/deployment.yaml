apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: provisioning-data-pvc
  namespace: provisioning
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-api
  namespace: provisioning
  labels:
    app.kubernetes.io/name: provisioning-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: provisioning-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provisioning-api
    spec:
      serviceAccountName: provisioning-api
      nodeSelector:
        sift.io/role: worker
      containers:
        - name: provisioning-api
          image: sift/provisioning-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: "/data/cloudnest.db"
            - name: PROVISIONING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provisioning-secrets
                  key: api-key
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: provisioning-secrets
                  key: jwt-secret
                  optional: true
            - name: MAGISTRALA_URL
              value: "http://magistrala-things.platform.svc.cluster.local:8182"
            - name: TB_URL
              value: "http://thingsboard.observability.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: provisioning-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: provisioning-api
  namespace: provisioning
  labels:
    app.kubernetes.io/name: provisioning-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: provisioning-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: provisioning-api-ingress
  namespace: provisioning
  labels:
    app.kubernetes.io/name: provisioning-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: api.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: provisioning-api
                port:
                  number: 3000
