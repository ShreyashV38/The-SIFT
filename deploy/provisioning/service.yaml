apiVersion: v1
kind: Service
metadata:
  name: sift-provisioning-api
  namespace: provisioning
  labels:
    app.kubernetes.io/name: provisioning-api
    app.kubernetes.io/part-of: cloudnest
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: internal
      port: 8081
      targetPort: 8081
  selector:
    app.kubernetes.io/name: provisioning-api
